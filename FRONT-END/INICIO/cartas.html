<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cartas - Boedo Clash</title>
    <link rel="stylesheet" href="../STYLES/estiloCartas.css">
</head>
<body>

<div class="contenedor-cartas">
    
    <a href="index.html" class="btn-volver-home">
    ⮜ Volver al Inicio
    </a>

    <h2>Cartas - Boedo Clash</h2>

    <div class="controls">
        <input id="buscador" class="buscador" placeholder="Buscar por nombre de carta..." />

        <select id="filtro-rarity">
            <option value="todas">Rareza (todas)</option>
            <option value="comun">Común</option>
            <option value="especial">Especial</option>
            <option value="epica">Épica</option>
            <option value="legendaria">Legendaria</option>
            <option value="campeon">Campeón</option>
        </select>

        <select id="filtro-rol">
            <option value="todos">Rol de Combate (todos)</option>
            <option value="T">Tanque Lento (T)</option>
            <option value="B">Tanque Rápido (B)</option>
            <option value="DM">Daño de Muerte (DM)</option>
            <option value="DS">Area Sostenido (DS)</option>
            <option value="AS">Soporte Aéreo (AS)</option>
            <option value="TS">Tirador Soporte (TS)</option>
            <option value="EM">Enjambre Terrestre(EM)</option>
            <option value="HD">Caza Tanques (HD)</option>
            <option value="M">Control/Mecánica (M)</option>
            <option value="TA">Tanque Aereo (TA)</option>
            <option value="EA">Enjambre Aereo (EA)</option>
            <option value="ED">Estructura Daño Área (ED)</option>
            <option value="ET">Estructura Objetivo Único (ET)</option>
            <option value="EC">Estructura Control (EC)</option>
            <option value="EG">Estructura Generación (EG)</option>
        </select>

        <select id="filtro-elixir">
            <option value="todas">Elixir (todos)</option>
            <option value="1">1</option><option value="2">2</option>
            <option value="3">3</option><option value="4">4</option>
            <option value="5">5</option><option value="6">6</option>
            <option value="7">7</option><option value="8+">8+</option>
        </select>

        <select id="filtro-vida">
        <option value="todas">Vida (todas)</option>
        <option value="baja">Baja (-500)</option>
        <option value="media">Media (500-1500)</option>
        <option value="alta">Alta (1500+)</option>
        </select>

        <select id="filtro-danio">
        <option value="todas">Daño (todos)</option>
        <option value="bajo">Bajo (-100)</option>
        <option value="medio">Medio (100-300)</option>
        <option value="alto">Alto (300+)</option>
        </select>
    </div>

    <div id="grid" class="grid-cartas">Cargando cartas...</div>
</div>

<script>
let cardsData = []; 
const grid = document.getElementById('grid');

// 1. OBTENCIÓN DE DATOS DESDE EL BACKEND
async function cargarCartasDesdeDB() {
    try {
        const respuesta = await fetch('http://localhost:3000/cartas'); // Endpoint de tu index.js
        if (!respuesta.ok) throw new Error("Error en la respuesta de la red");
        
        cardsData = await respuesta.json(); // Se cargan los datos de la DB
        renderCards(cardsData); 
    } catch (error) {
        console.error("Error al conectar con el servidor:", error);
        grid.innerHTML = "<p style='color:red; grid-column: 1/-1;'>Error: Asegúrate de que el backend esté corriendo.</p>";
    }
}

// 2. RENDERIZADO DE CARTAS
function renderCards(list) {
    grid.innerHTML = "";
    list.forEach(c => {
        const div = document.createElement('div');
        div.className = 'carta';
        
        const img = document.createElement('img');
        img.src = c.imagen; // URL de imagen de tu SQL
        img.alt = c.nombre;
        img.onerror = () => { img.src = 'https://via.placeholder.com/150?text=No+Image'; };

        const nameDiv = document.createElement('div');
        nameDiv.className = 'nombre-carta';
        nameDiv.textContent = c.nombre;

        const meta = document.createElement('div');
        meta.className = 'meta';

        // Muestra costo, calidad, daño, vida y rol de combate
        meta.innerHTML = `
            <div>Elixir: ${c.costo_elixir} • ${c.calidad}</div>
            <div style="font-size: 0.85em; margin-top: 5px; color: #ffd700;">
                HP: ${c.puntos_de_vida} | Daño: ${c.daño} | ${c.rol_combate || 'N/A'}
            </div>
        `;

        div.appendChild(img);
        div.appendChild(nameDiv);
        div.appendChild(meta);
        grid.appendChild(div);
    });
}

// 3. LÓGICA DE FILTRADO REFORZADA
const buscador = document.getElementById('buscador');
const filtroRarity = document.getElementById('filtro-rarity');
const filtroElixir = document.getElementById('filtro-elixir');
const filtroRol = document.getElementById('filtro-rol');
const filtroVida = document.getElementById('filtro-vida'); // Nuevo
const filtroDanio = document.getElementById('filtro-danio'); // Nuevo

function aplicarFiltros() {
    const texto = buscador.value.trim().toLowerCase(); // Búsqueda más limpia
    const rareza = filtroRarity.value;
    const elixir = filtroElixir.value;
    const rol = filtroRol.value;
    const vida = filtroVida.value;
    const danio = filtroDanio.value;

    const filtradas = cardsData.filter(c => {
        // Solo busca coincidencias en el nombre de la carta
        const coincideNombre = c.nombre.toLowerCase().includes(texto);
        
        // Filtra por calidad (común, épica, etc.)
        const coincideRareza = rareza === 'todas' || c.calidad.toLowerCase() === rareza;
        
        // Filtra por rol de combate (T, AS, EM, etc.)
        const coincideRol = rol === 'todos' || c.rol_combate === rol;
        
        // Filtra por costo de elixir
        let coincideElixir = true;
        if (elixir !== 'todas') {
            if (elixir === '8+') coincideElixir = c.costo_elixir >= 8;
            else coincideElixir = c.costo_elixir.toString() === elixir;
        }

        // Filtro Vida (Lógica de rangos)
        let coincideVida = true;
        if (vida === 'baja') coincideVida = c.puntos_de_vida < 500;
        else if (vida === 'media') coincideVida = c.puntos_de_vida >= 500 && c.puntos_de_vida <= 1500;
        else if (vida === 'alta') coincideVida = c.puntos_de_vida > 1500;

        // Filtro Daño (Lógica de rangos)
        let coincideDanio = true;
        if (danio === 'bajo') coincideDanio = c.daño < 100;
        else if (danio === 'medio') coincideDanio = c.daño >= 100 && c.daño <= 300;
        else if (danio === 'alto') coincideDanio = c.daño > 300;

        return coincideNombre && coincideRareza && coincideElixir && coincideRol && coincideVida && coincideDanio;
    });

    // Manejo de resultados vacíos
    if (filtradas.length === 0) {
        grid.innerHTML = "<p style='grid-column: 1/-1; text-align: center;'>No se encontraron cartas.</p>";
    } else {
        renderCards(filtradas);
    }
}

// Escucha de eventos para actualizaciones en tiempo real
buscador.addEventListener('input', aplicarFiltros);
filtroRarity.addEventListener('change', aplicarFiltros);
filtroElixir.addEventListener('change', aplicarFiltros);
filtroRol.addEventListener('change', aplicarFiltros);
filtroVida.addEventListener('change', aplicarFiltros);
filtroDanio.addEventListener('change', aplicarFiltros);

// Carga inicial
cargarCartasDesdeDB();
</script>

</body>
</html>
