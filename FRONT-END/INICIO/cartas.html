<style>
  body { background-color: #0c1e2c; font-family: Arial, sans-serif; color: white; }

  h2 { color: #ffd700; font-size: 2.2em; margin-bottom: 10px; text-shadow: 2px 2px 4px black; }
  .controls { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin: 18px 0 28px; }
  .buscador { width: 60%; min-width: 240px; padding: 12px; border-radius: 12px; border: none; font-size: 1.05em; }
  select { padding: 10px; font-size: 1em; border-radius: 10px; border: none; background: rgba(255,255,255,0.95); cursor:pointer; min-width: 160px; }
  .grid-cartas { display:grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap:18px; margin-top:18px; }
  .carta { background: rgba(255,255,255,0.10); border-radius: 14px; padding:10px; text-align:center; box-shadow:0 0 12px rgba(255,215,0,0.22); cursor: pointer; transition: .18s; }
  .carta:hover { transform: scale(1.05); box-shadow: 0 0 18px #ffd700; }
  .carta img{ width:100%; border-radius:10px; display:block; margin:0 auto; background: rgba(0,0,0,0.12); }
  .img-fallback { width:100%; height:180px; display:flex; align-items:center; justify-content:center; background: rgba(0,0,0,0.2); border-radius:10px; color:#bbb; font-size:0.9em; }
  .nombre-carta{ margin-top:8px; font-weight:700; color:#ffd700; text-shadow:1px 1px 2px black; }
  .meta { font-size:0.85em; color:#eee; margin-top:6px; text-transform:capitalize; }
  .badges { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-top:8px; }
  .badge { background: rgba(0,0,0,0.35); padding:4px 8px; border-radius:8px; font-size:0.75em; color:#fff; }
  @media (max-width:600px){
    .buscador { width: 95%; }
    select { min-width: 140px; }
  }
</style>
</head>

const grid = document.getElementById('grid');

function imageUrlFor(eng){
  return `https://cdn.royaleapi.com/static/img/cards/${eng}.png?t=${Date.now()}`;
}

function renderCards(list){
  grid.innerHTML = "";
  list.forEach(c => {
    const div = document.createElement('div');
    div.className = 'carta';
    div.setAttribute('data-name', c.esp.toLowerCase());
    div.setAttribute('data-rarity', c.rarity);
    div.setAttribute('data-elixir', c.elixir);
    div.setAttribute('data-type', c.type);
    div.setAttribute('data-attack', c.attack || 'mixto');
    div.setAttribute('data-role', c.role || 'support');

    const img = document.createElement('img');
    img.src = imageUrlFor(c.eng);
    img.alt = c.esp;
    img.onerror = () => {
      const fb = document.createElement('div');
      fb.className = 'img-fallback';
      fb.textContent = c.esp.substring(0,12);
      img.replaceWith(fb);
    };

    const nameDiv = document.createElement('div');
    nameDiv.className = 'nombre-carta';
    nameDiv.textContent = c.esp;

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.innerHTML = `Elixir: ${c.elixir} • ${c.rarity.charAt(0).toUpperCase() + c.rarity.slice(1)} • ${c.type}`;

    div.appendChild(img);
    div.appendChild(nameDiv);
    div.appendChild(meta);
    grid.appendChild(div);
  });
}

const buscador = document.getElementById('buscador');
const selects = {
  rarity: document.getElementById('filtro-rarity'),
  elixir: document.getElementById('filtro-elixir'),
  type: document.getElementById('filtro-type'),
  attack: document.getElementById('filtro-attack'),
  role: document.getElementById('filtro-role')
};

function applyFilters(){
  const text = buscador.value.trim().toLowerCase();
  const sel = {
    rarity: selects.rarity.value,
    elixir: selects.elixir.value,
    type: selects.type.value,
    attack: selects.attack.value,
    role: selects.role.value
  };

  const filtered = cardsData.filter(c => {
    const matchesText = !text || c.esp.toLowerCase().includes(text) || c.eng.toLowerCase().includes(text);
    const matchRarity = sel.rarity === 'todas' || c.rarity === sel.rarity;
    const matchType = sel.type === 'todas' || c.type === sel.type;
    const matchAttack = sel.attack === 'todos' || c.attack === sel.attack;
    const matchRole = sel.role === 'todos' || c.role === sel.role;

    let matchElixir = true;
    if (sel.elixir !== 'todas') {
      if (sel.elixir === '8+') matchElixir = parseInt(c.elixir) >= 8 || c.elixir === 'variable';
      else matchElixir = c.elixir === sel.elixir;
    }

    return matchesText && matchRarity && matchType && matchAttack && matchRole && matchElixir;
  });

  renderCards(filtered);
}

buscador.addEventListener('input', applyFilters);
Object.values(selects).forEach(s => s.addEventListener('change', applyFilters));

renderCards(cardsData);
</script>
