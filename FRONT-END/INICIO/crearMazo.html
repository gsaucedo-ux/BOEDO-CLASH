<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Mazo - Boedo Clash</title>
    <link rel="stylesheet" href="../STYLES/estiloCrearMazo.css">
</head>
<body>

<div class="crear-contenedor">
    <div class="volver-contenedor">
    <button onclick="window.location.href='index.html'" class="boton-volver-centrado">
        ⮜ Volver
    </button>
    </div>



    <h1 class="titulo">Crear Nuevo Mazo</h1>

    <div class="form-row">
        <div class="form-grupo half">
            <label>Nombre del mazo</label>
            <input id="nombreMazo" type="text" placeholder="Ejemplo: Ciclo Monta 2.6">
        </div>
    </div>

    <h2 class="subtitulo">Cartas del Mazo (8)</h2>
    <div class="deck-grid">
        <div class="card-slot" data-slot="0"></div>
        <div class="card-slot" data-slot="1"></div>
        <div class="card-slot" data-slot="2"></div>
        <div class="card-slot" data-slot="3"></div>
        <div class="card-slot" data-slot="4"></div>
        <div class="card-slot" data-slot="5"></div>
        <div class="card-slot" data-slot="6"></div>
        <div class="card-slot" data-slot="7"></div>
    </div>

    <div id="selectorCartas" class="selector oculto">
        <div class="selector-header">
            <h3>Elegí una carta</h3>
            <button class="cerrar" onclick="cerrarSelector()">X</button>
        </div>

        <input id="buscador" class="buscador" placeholder="Buscar por nombre...">

        <div class="controls">
            <select id="filtro-rarity">
                <option value="todas">Rareza (todas)</option>
                <option value="comun">Común</option>
                <option value="especial">Especial</option>
                <option value="epica">Épica</option>
                <option value="legendaria">Legendaria</option>
                <option value="campeon">Campeón</option>
            </select>

            <select id="filtro-rol">
                    <option value="todos">Rol de Combate (todos)</option>
                    <option value="T">Tanque Lento (T)</option>
                    <option value="B">Tanque Rápido (B)</option>
                    <option value="DM">Daño de Muerte (DM)</option>
                    <option value="DS">Area Sostenido (DS)</option>
                    <option value="AS">Soporte Aéreo (AS)</option>
                    <option value="TS">Tirador Soporte (TS)</option>
                    <option value="EM">Enjambre Terrestre(EM)</option>
                    <option value="HD">Caza Tanques (HD)</option>
                    <option value="M">Control/Mecánica (M)</option>
                    <option value="TA">Tanque Aereo (TA)</option>
                    <option value="EA">Enjambre Aereo (EA)</option>
                    <option value="ED">Estructura Daño Área (ED)</option>
                    <option value="ET">Estructura Objetivo Único (ET)</option>
                    <option value="EC">Estructura Control (EC)</option>
                    <option value="EG">Estructura Generación (EG)</option>
            </select>

            <select id="filtro-elixir">
            <option value="todas">Elixir (todos)</option>
            <option value="1">1</option><option value="2">2</option>
            <option value="3">3</option><option value="4">4</option>
            <option value="5">5</option><option value="6">6</option>
            <option value="7">7</option><option value="8+">8+</option>
            </select>

            <select id="filtro-vida">
                <option value="todas">Vida (todas)</option>
                <option value="baja">Baja (-500)</option>
                <option value="media">Media (500-1500)</option>
                <option value="alta">Alta (1500+)</option>
            </select>

            <select id="filtro-danio">
                <option value="todas">Daño (todos)</option>
                <option value="bajo">Bajo (-100)</option>
                <option value="medio">Medio (100-300)</option>
                <option value="alto">Alto (300+)</option>
            </select>
            
            </div>

        <div id="gridCartas" class="selector-grid">Cargando cartas de la DB...</div>
    </div>

    <button class="boton-guardar" onclick="guardarMazo()">Guardar Mazo</button>
</div>

<script>
    let allCards = []; // Aquí guardaremos lo que venga de la DB
    let deck = [null, null, null, null, null, null, null, null];
    let slotActual = null;

    // 1. CARGAR CARTAS DESDE EL BACKEND (Igual que en cartas.html)
    async function cargarCartas() {
        try {
            const res = await fetch('http://localhost:3000/cartas');
            allCards = await res.json();
            renderSelector(allCards);
        } catch (error) {
            console.error("Error cargando cartas:", error);
        }
    }

    function renderSelector(list) {
        const grid = document.getElementById("gridCartas");
        grid.innerHTML = "";
        list.forEach(c => {
            const div = document.createElement("div");
            div.className = "card-item";
            div.innerHTML = `
                <img src="${c.imagen}" alt="${c.nombre}">
                <span>${c.nombre}</span>
            `;
            div.onclick = () => seleccionarCarta(c);
            grid.appendChild(div);
        });
    }

    // 2. FILTRADO (Lógica de cartas.html)
    function aplicarFiltros() {
    const texto = document.getElementById('buscador').value.toLowerCase();
    const rareza = document.getElementById('filtro-rarity').value;
    const rol = document.getElementById('filtro-rol').value;
    const elixir = document.getElementById('filtro-elixir').value;
    const vida = document.getElementById('filtro-vida').value;
    const danio = document.getElementById('filtro-danio').value;

    const filtradas = allCards.filter(c => {
        const matchNombre = c.nombre.toLowerCase().includes(texto);
        const matchRareza = rareza === 'todas' || c.calidad.toLowerCase() === rareza;
        const matchRol = rol === 'todos' || c.rol_combate === rol;
        
        // Filtro de Elixir
        let matchElixir = true;
        if (elixir !== 'todas') {
            matchElixir = elixir === '8+' ? c.costo_elixir >= 8 : c.costo_elixir.toString() === elixir;
        }

        // Filtro de Vida
        let matchVida = true;
        if (vida === 'baja') matchVida = c.puntos_de_vida < 500;
        else if (vida === 'media') matchVida = c.puntos_de_vida >= 500 && c.puntos_de_vida <= 1500;
        else if (vida === 'alta') matchVida = c.puntos_de_vida > 1500;

        // Filtro de Daño
        let matchDanio = true;
        if (danio === 'bajo') matchDanio = c.daño < 100;
        else if (danio === 'medio') matchDanio = c.daño >= 100 && c.daño <= 300;
        else if (danio === 'alto') matchDanio = c.daño > 300;

        return matchNombre && matchRareza && matchRol && matchElixir && matchVida && matchDanio;
    });
    
    renderSelector(filtradas);
}

    function seleccionarCarta(carta) {
    // 1. REVISIÓN DE DUPLICADOS
    const yaEstaEnElMazo = Object.values(deck).some(c => c && c.carta_id === carta.carta_id);

    if (yaEstaEnElMazo) {
        alert("⚠️ ¡Esta carta ya está en tu mazo! Elegí una diferente.");
        cerrarSelector(); 
        return;
    }
    
    if (slotActual !== null) {
        deck[slotActual] = carta; // Guardamos el objeto de la carta en el slot
        document.querySelector(`[data-slot="${slotActual}"]`).innerHTML = 
            `<img src="${carta.imagen}">`;
    }
    cerrarSelector();
    }


    function abrirSelector() { document.getElementById("selectorCartas").classList.remove("oculto"); }
    function cerrarSelector() { document.getElementById("selectorCartas").classList.add("oculto"); }

    document.querySelectorAll(".card-slot").forEach(slot => {
        slot.onclick = () => {
            slotActual = slot.dataset.slot;
            abrirSelector();
        };
    });

    async function guardarMazo() {
        const nombre = document.getElementById("nombreMazo").value;
        const usuarioId = localStorage.getItem("usuarioId") || 1; 

        if (!nombre || deck.includes(null)) return alert("Completa el nombre y las 8 cartas.");

        const mazoData = {
            nombre: nombre,
            usuario_id: parseInt(usuarioId),
            cartas: deck.map(c => c.carta_id) // Guardamos nombres o IDs
        };

        try {
            const res = await fetch('http://localhost:3000/mazos', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(mazoData)
            });

            if(res.ok) {
                alert("Mazo guardado en la Base de Datos!");
                window.location.href = "perfil.html";
            }
        } catch (error) { alert("Error al conectar con el servidor."); }
    }

    document.getElementById('buscador').addEventListener('input', aplicarFiltros);
    document.getElementById('filtro-rarity').addEventListener('change', aplicarFiltros);
    document.getElementById('filtro-rol').addEventListener('change', aplicarFiltros);
    document.getElementById('filtro-elixir').addEventListener('change', aplicarFiltros);
    document.getElementById('filtro-vida').addEventListener('change', aplicarFiltros);
    document.getElementById('filtro-danio').addEventListener('change', aplicarFiltros);

    cargarCartas();
</script>
</body>
</html>
