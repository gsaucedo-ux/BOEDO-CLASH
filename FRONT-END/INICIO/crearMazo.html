<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Mazo - Boedo Clash</title>

    <link rel="stylesheet" href="../STYLES/estiloCrearMazo.css">
</head>

<body>

<div class="crear-contenedor">

    <div style="text-align: left; margin-bottom: 20px;">
    <button onclick="window.location.href='index.html'" 
            class="select-deck-button" 
            style="background-color: #e67e22; 
                   border: 2px solid #fff; 
                   padding: 12px 25px; 
                   font-size: 1.2em; 
                   font-weight: bold; 
                   cursor: pointer;">
        ⮜ Volver
    </button>
    </div>

    <h1 class="titulo">Crear Nuevo Mazo</h1>

<!-- NOMBRE + PRIVACIDAD EN LA MISMA LÍNEA -->
<div class="form-row">
    <div class="form-grupo half">
        <label>Nombre del mazo</label>
        <input id="nombreMazo" type="text" placeholder="Ejemplo: Ciclo Monta 2.6">
    </div>
    
    <div class="form-grupo half">
        <label>Privacidad</label>
        <select id="privacidad">
            <option value="publico">Público</option>
            <option value="privado">Privado</option>
        </select>
    </div>
</div>

<h2 class="subtitulo">Cartas del Mazo (8)</h2>

    <div class="deck-grid">
        <div class="card-slot" data-slot="0"></div>
        <div class="card-slot" data-slot="1"></div>
        <div class="card-slot" data-slot="2"></div>
        <div class="card-slot" data-slot="3"></div>
        <div class="card-slot" data-slot="4"></div>
        <div class="card-slot" data-slot="5"></div>
        <div class="card-slot" data-slot="6"></div>
        <div class="card-slot" data-slot="7"></div>
    </div>


    <!-- SELECTOR DE CARTAS -->
    <div id="selectorCartas" class="selector oculto">

        <div class="selector-header">
            <h3>Elegí una carta</h3>
            <button class="cerrar" onclick="cerrarSelector()">X</button>
        </div>

        <input id="buscador" class="buscador" placeholder="Buscar carta...">

        <div class="controls">
            <select id="filtro-rarity"><option value="todas">Rareza (todas)</option>
                <option value="comun">Común</option><option value="especial">Especial</option>
                <option value="epica">Épica</option><option value="legendaria">Legendaria</option>
                <option value="campeon">Campeón</option>
            </select>

            <select id="filtro-elixir"><option value="todas">Elixir (todos)</option>
                <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                <option value="7">7</option><option value="8+">8+</option>
            </select>

            <select id="filtro-type"><option value="todas">Tipo (todas)</option>
                <option value="tropa">Tropa</option><option value="hechizo">Hechizo</option><option value="estructura">Estructura</option>
            </select>

            <select id="filtro-attack"><option value="todos">Ataque (todos)</option>
                <option value="terrestre">Terrestre</option><option value="aereo">Aéreo</option><option value="mixto">Ambos</option>
            </select>

            <select id="filtro-role"><option value="todos">Rol</option>
                <option value="wincondition">Win condition</option><option value="tank">Tank</option>
                <option value="support">Support</option><option value="swarm">Swarm</option>
                <option value="defense">Defense</option><option value="spell">Spell</option>
            </select>
        </div>

        <div id="gridCartas" class="selector-grid"></div>
    </div>

    <!-- BOTÓN FINAL -->
    <button class="boton-guardar" onclick="guardarMazo()">Guardar Mazo</button>

</div>

  { eng:"furnace", esp:"Horno", rarity:"especial", elixir:"4", type:"estructura", attack:"terrestre", range:"medio", speed:"n/a", attackSpeed:"lento", hp:"media", role:"support", combatRole:"TS" },
  { eng:"goblin-hut", esp:"Choza de Duendes", rarity:"especial", elixir:"5", type:"estructura", attack:"mixto", range:"medio", speed:"n/a", attackSpeed:"medio", hp:"media", role:"support", combatRole:"TS" },
  { eng:"tombstone", esp:"Lápida", rarity:"especial", elixir:"3", type:"estructura", attack:"terrestre", range:"corto", speed:"n/a", attackSpeed:"medio", hp:"media", role:"defense", combatRole:"EM" },
  { eng:"tesla", esp:"Torre Tesla", rarity:"especial", elixir:"4", type:"estructura", attack:"mixto", range:"medio", speed:"n/a", attackSpeed:"medio", hp:"media", role:"defense", combatRole:"E" },
  { eng:"x-bow", esp:"Ballesta", rarity:"epica", elixir:"6", type:"estructura", attack:"mixto", range:"largo", speed:"n/a", attackSpeed:"medio", hp:"media", role:"defense", combatRole:"E" },
  { eng:"goblin-drill", esp:"Excavadora de Duendes", rarity:"epica", elixir:"4", type:"estructura", attack:"terrestre", range:"corto", speed:"n/a", attackSpeed:"medio", hp:"media", role:"wincondition", combatRole:"B" },
  { eng:"suspicious-bush", esp:"Arbusto Sospechoso", rarity:"especial", elixir:"2", type:"estructura", attack:"terrestre", range:"corto", speed:"n/a", attackSpeed:"medio", hp:"baja", role:"support", combatRole:"M" }
];

    let slotActual = null;
    const deck = [null, null, null, null, null, null, null, null];

    const selector = document.getElementById("selectorCartas");
    const gridCartas = document.getElementById("gridCartas");

    // Referencias a los elementos de filtro
    const buscador = document.getElementById('buscador');
    const selects = {
        rarity: document.getElementById('filtro-rarity'),
        elixir: document.getElementById('filtro-elixir'),
        type: document.getElementById('filtro-type'),
        attack: document.getElementById('filtro-attack'),
        role: document.getElementById('filtro-role')
    };

    function abrirSelector(){
        selector.classList.remove("oculto");
        applyFilters(); // Renderiza las cartas al abrir
    }

    function cerrarSelector(){
        selector.classList.add("oculto");
    }

    // Función para renderizar las cartas en el selector (imitando batalla.html)
    function renderSelector(list) {
        gridCartas.innerHTML = "";
        list.forEach(c => {
            const div = document.createElement("div");
            div.className = "card-item";

            const img = document.createElement('img');
            img.src = `https://cdn.royaleapi.com/static/img/cards/${c.eng}.png?t=${Date.now()}`;
            img.alt = c.esp;
            img.onerror = () => {
                const fb = document.createElement('div');
                fb.className = 'img-fallback';
                fb.textContent = c.esp.substring(0,12);
                img.replaceWith(fb);
            };

            const nameSpan = document.createElement('span');
            nameSpan.textContent = c.esp;

            div.appendChild(img);
            div.appendChild(nameSpan);

            div.onclick = () => seleccionarCarta(c);

            gridCartas.appendChild(div);
        });
    }

    // Función para aplicar filtros (copiada y adaptada de batalla.html)
    function applyFilters() {
        const text = buscador.value.trim().toLowerCase();
        const sel = {
            rarity: selects.rarity.value,
            elixir: selects.elixir.value,
            type: selects.type.value,
            attack: selects.attack.value,
            role: selects.role.value
        };

        const filtered = cardsData.filter(c => {
            const matchesText = !text || c.esp.toLowerCase().includes(text) || c.eng.toLowerCase().includes(text);
            const matchRarity = sel.rarity === 'todas' || c.rarity === sel.rarity;
            const matchType = sel.type === 'todas' || c.type === sel.type;
            const matchAttack = sel.attack === 'todos' || c.attack === sel.attack;
            const matchRole = sel.role === 'todos' || c.role === sel.role;

            let matchElixir = true;
            if (sel.elixir !== 'todas') {
                if (sel.elixir === '8+') matchElixir = parseInt(c.elixir) >= 8 || c.elixir === 'variable';
                else matchElixir = c.elixir === sel.elixir;
            }

            return matchesText && matchRarity && matchType && matchAttack && matchRole && matchElixir;
        });

        renderSelector(filtered);
    }

    // Elegir carta (actualizada para consistencia)
    function seleccionarCarta(carta){
        if (slotActual !== null) {
            deck[slotActual] = carta;
            const slotElement = document.querySelector(`[data-slot="${slotActual}"]`);
            const imageUrl = `https://cdn.royaleapi.com/static/img/cards/${carta.eng}.png?t=${Date.now()}`;
            slotElement.innerHTML = `<img src="${imageUrl}" alt="${carta.esp}">`;
        }
        cerrarSelector();
    }

    // Abrir selector al clicar slot
    document.querySelectorAll(".card-slot").forEach(slot => {
        slot.onclick = () => {
            slotActual = parseInt(slot.dataset.slot);
            abrirSelector();
        }
    });

    // Guardar el mazo
    function guardarMazo(){
        const nombre = document.getElementById("nombreMazo").value;
        const priv = document.getElementById("privacidad").value;

        if (!nombre) return alert("Poné un nombre para el mazo.");
        if (deck.includes(null)) return alert("Faltan cartas en el mazo.");

        const nuevoMazo = {
            titulo: nombre,
            publico: priv === "publico",
            cartas: deck.map(c => c.eng)
        };

        // Guardar en localStorage
        const mazosExistentes = JSON.parse(localStorage.getItem("mazosUsuario") || "[]");

        mazosExistentes.push(nuevoMazo);

        localStorage.setItem("mazosUsuario", JSON.stringify(mazosExistentes));

        alert("Mazo guardado!");
        window.location.href = "perfil.html";
    }

    // Inicializa listeners para filtros y búsqueda
    buscador.addEventListener('input', applyFilters);
    Object.values(selects).forEach(s => s.addEventListener('change', applyFilters));

    // Render inicial al cargar (opcional, pero para consistencia)
    applyFilters();
</script>
