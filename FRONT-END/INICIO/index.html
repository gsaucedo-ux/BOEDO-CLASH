<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boedo Clash - Foro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link rel="icon" type="image/png" href="../../img/LogoDefinitivo.jpg">
    <link rel="stylesheet" href="../STYLES/estiloPaginaPrincipalCabeza.css">
    <link rel="stylesheet" href="../STYLES/estiloPaginaPrincipalCuerpo.css">
    <link rel="stylesheet" href="../STYLES/estilo_comentarios.css">
</head>

<body>
    <div class="bSuperiores"> 
        <img src="../../img/LogoDefinitivo.jpg" alt="Logo" class="nav-logo"> 

        <a href="batalla.html" class="bSuperiorCrearBatalla"> 
            <img src="../../img/botonBatalla.jpg" alt="Batalla" class="imagen-boton-batalla">
            <span class="texto-superpuesto-batalla">Batalla</span>
        </a>

        <a href="CrearCarta.html" class="bSuperiorSesion auth-required" style="display: none;">Crear Carta</a>
        <a href="cartas.html" class="bSuperiorSesion">Cartas</a>
        <a href="crearMazo.html" class="bSuperiorSesion auth-required" style="display: none;">Crear Mazo</a>

        <a href="iniciarSesion.html" id="btnSesion" class="bSuperiorSesion">
            Crear/Iniciar Sesión
        </a>
    </div>

    <div id="buscador">
        <form class="search-bar" id="search-form" role="search" >
            <input id="search-input" type="search" name="q" placeholder="Buscar mazos, jugadores.. " autocomplete="off" />
            <button type="submit" >Buscar</button>
        </form>
    </div>
    
    <div id="foroMazos" class="inferiorcontenido">
        <p style="color: white; padding: 20px;">Cargando los mejores mazos de Boedo...</p>
    </div>

    <footer class="pie_de_pagina">
        <div class="informacion_grupo"><a>NOSOTROS</a></div>
        <div>
            <ul class="lista_redes_sociales">
                <li><a href="#"><img src="../../img/img_instagram.png" class="redes_sociales"></a></li>
                <li><a href="#"><img src="../../img/img_facebook.png" class="redes_sociales"></a></li>
                <li><a href="#"><img src="../../img/twiter.png" class="redes_sociales"></a></li>
            </ul>
        </div>
    </footer>

    <div id="ventana_comentarios" class="contenedor_oculto selector_comentarios">
        <div class="salida_comentarios">
            <div><button class="barra">x</button></div>
            <div class="header_comentarios"><p>COMENTARIOS</p></div>
        </div>
        <div class="contenedor_comentarios" id="listaComentariosReal"> 
        </div>
         <div class="nuevo_comentario">
            <div class="imagen_usuario">
                <img src="../../img/LogoDefinitivo.jpg" />
            </div>
            <div class="comentar">
                <div class="caja_comentario">
                    <select id="puntuacionInput" style="background: #333; color: gold; border: 1px solid #555; border-radius: 5px; margin-bottom: 5px; width: 100%;">
                        <option value="5">⭐⭐⭐⭐⭐ (5)</option>
                        <option value="4">⭐⭐⭐⭐ (4)</option>
                        <option value="3">⭐⭐⭐ (3)</option>
                        <option value="2">⭐⭐ (2)</option>
                        <option value="1">⭐ (1)</option>
                    </select>
                    <input type="text" id="inputComentario" class="comentario" placeholder="Únete a la conversación">
                </div>
            </div>
            <div class="boton_enviar_mensaje" onclick="enviarComentario()">
                <img src="../../img/boton_enviar_mensaje.png" />
            </div>
            </div>
    </div>

    <script>

            let mazoActual = null;
        document.addEventListener('DOMContentLoaded', () => {
    const idLogueado = localStorage.getItem("usuarioId");
    const btnSesion = document.getElementById("btnSesion");
    const linksPrivados = document.querySelectorAll('.auth-required');

    if (idLogueado && idLogueado !== "undefined") {
        btnSesion.textContent = "Mi Perfil";
        btnSesion.href = "perfil.html";
        linksPrivados.forEach(l => l.style.display = "flex");
    }

    // --- NUEVA LÓGICA DE BÚSQUEDA ---
    const searchForm = document.getElementById("search-form");
    const searchInput = document.getElementById("search-input");

    searchForm.addEventListener('submit', (e) => {
        e.preventDefault(); // Evita que la página se recargue
        const termino = searchInput.value.trim();
        cargarForo(termino); // Llamamos a la función con el filtro
    });

    cargarForo(); // Carga inicial

    const urlParams = new URLSearchParams(window.location.search);
    const mazoParaAbrir = urlParams.get('abrirMazo');

    if (mazoParaAbrir) {
        // Le damos un mini respiro para que cargue todo y abrimos
        setTimeout(() => {
            abrirComentarios(mazoParaAbrir);
            // Limpiamos la URL para que no se reabra si el usuario refresca
            window.history.replaceState({}, document.title, "index.html");
        }, 500);
    }
    
    });

// Modificamos la función para que acepte el término
async function cargarForo(busqueda = "") {
    const contenedor = document.getElementById("foroMazos");
    
    // Mostramos un feedback de carga
    contenedor.innerHTML = "<p style='color: white; padding: 20px;'>Buscando en la arena...</p>";

    try {
        // Si hay búsqueda, añadimos el parámetro ?q= al fetch
        const url = busqueda 
            ? `http://localhost:3000/mazos/publicos?q=${encodeURIComponent(busqueda)}`
            : 'http://localhost:3000/mazos/publicos';

        const res = await fetch(url);
        if (!res.ok) throw new Error("Error en el servidor");
        const mazos = await res.json();

        if (mazos.length === 0) {
            contenedor.innerHTML = `<p style='color:white; margin:20px;'>No se encontraron mazos para "${busqueda}".</p>`;
            return;
        }

        contenedor.innerHTML = ""; // Limpiamos

        mazos.forEach(m => {
            contenedor.innerHTML += `
                <div class="mazo-publicado">
                    <div class="cabecera_mazo">
                        <div class="costo_elixir">
                            <img src="../../img/gota_elixir.png" alt="elixir"/>
                            <span class="texto_superpuesto_elixir">${m.promedio_elixir || '0.0'}</span>
                        </div>
                        <p>${m.nombre}</p>
                    </div>
                    <div class="imagen_cartas">
                        ${m.cartas && m.cartas.length > 0 
                          ? m.cartas.map(c => `<div><img src="${c.imagen}" title="${c.nombre}" /></div>`).join('')
                          : '<p style="color:gray; font-size:10px;">Mazo sin cartas</p>'}
                    </div>
                    <div class="pie_mazo">
                        <div><p>Autor: <b>${m.autor_nombre}</b></p></div>
                        <div><p>Victorias totales del mazo: ${m.victorias_totales || 0}</p></div>
                    </div>
                    <button class="comentarios_mazos" onclick="abrirComentarios(${m.mazo_id})"> 
                        comentarios
                    </button>
                </div>
            `;
        });

            } catch (err) {
                console.error("Error en foro:", err);
                contenedor.innerHTML = "<p style='color:white; padding:20px;'>El servidor de mazos está fuera de servicio. Revisa la consola (F12).</p>";
            }
        }

        const ventana = document.getElementById("ventana_comentarios");
        const barra_salida = document.querySelector(".salida_comentarios");

      async function abrirComentarios(mazoId) {
    mazoActual = mazoId;
    ventana.classList.remove("selector_comentarios");

    const lista = document.getElementById("listaComentariosReal");
    lista.innerHTML = "<p style='color:white'>Cargando comentarios...</p>";

    try {
        const res = await fetch(`http://localhost:3000/mazos/${mazoId}/comentarios`);
        if (!res.ok) throw new Error("Error al obtener comentarios");

        const comentarios = await res.json();
        if (comentarios.length === 0) {
            lista.innerHTML = "<p style='color:white'>No hay comentarios todavía</p>";
            return;
        }

        lista.innerHTML = `
            ${comentarios.map(c => `
                <div class="comentarios" style="border-bottom: 1px solid #444; margin-bottom: 10px; padding-bottom: 5px;">
                    <div style="display: flex; justify-content: space-between;">
                        <b>${c.alias}</b>
                        <span style="color: gold;">${generarEstrellas(c.puntuacion)}</span>
                    </div>
                    <p>${c.texto}</p>
                    <small style="color: gray; font-size: 0.8em;">${new Date(c.creado_en).toLocaleString()}</small>
                </div>
            `).join("")}
        `;

    } catch (err) {
        console.error("Error cargando comentarios:", err);
        lista.innerHTML = "<p style='color:red'>Error al cargar comentarios</p>";
    }
}


async function enviarComentario() {
    const input = document.getElementById("inputComentario");
    const puntuacionInput = document.getElementById("puntuacionInput"); // 🔥 Capturamos el select
    const texto = input.value.trim();
    const usuarioId = localStorage.getItem("usuarioId");
    const puntuacion = puntuacionInput.value; // 🔥 Obtenemos el valor (1-5)

    if (!usuarioId) {
        alert("Tenés que iniciar sesión para comentar");
        return;
    }

    if (!texto) {
        alert("El comentario no puede estar vacío");
        return;
    }

    try {
        const res = await fetch(`http://localhost:3000/mazos/${mazoActual}/comentarios`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                texto: texto,
                usuario_id: usuarioId,
                puntuacion: parseInt(puntuacion) // 🔥 Enviamos la puntuación al backend
            })
        });

        if (!res.ok) {
            throw new Error("Error al enviar comentario");
        }

        input.value = "";          // limpiamos input
        abrirComentarios(mazoActual); // 🔥 recargamos la lista

    } catch (err) {
        console.error("Error enviando comentario:", err);
        alert("No se pudo enviar el comentario");
    }
}

function generarEstrellas(n) {
    if (!n) return "Sin puntuación";
    return "⭐".repeat(n);
}

        barra_salida.onclick = () => {
            ventana.classList.add("selector_comentarios");
        };
    </script>
</body>
</html>
