<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boedo Clash - Foro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link rel="icon" type="image/png" href="../../img/LogoDefinitivo.jpg">
    <link rel="stylesheet" href="../STYLES/estiloPaginaPrincipalCabeza.css">
    <link rel="stylesheet" href="../STYLES/estiloPaginaPrincipalCuerpo.css">
    <link rel="stylesheet" href="../STYLES/estilo_comentarios.css">
</head>

<body>
    <div class="bSuperiores"> 
        <img src="../../img/LogoDefinitivo.jpg" alt="Logo" class="nav-logo"> 

        <a href="batalla.html" class="bSuperiorCrearBatalla"> 
            <img src="../../img/botonBatalla.jpg" alt="Batalla" class="imagen-boton-batalla">
            <span class="texto-superpuesto-batalla">Batalla</span>
        </a>

        <a href="CrearCarta.html" class="bSuperiorSesion auth-required" style="display: none;">Crear Carta</a>
        <a href="cartas.html" class="bSuperiorSesion">Cartas</a>
        <a href="crearMazo.html" class="bSuperiorSesion auth-required" style="display: none;">Crear Mazo</a>

        <a href="iniciarSesion.html" id="btnSesion" class="bSuperiorSesion">
            Crear/Iniciar Sesión
        </a>
    </div>

    <div id="buscador">
        <form class="search-bar" id="search-form" role="search" >
            <input id="search-input" type="search" name="q" placeholder="Buscar mazos, jugadores.. " autocomplete="off" />
            <button type="submit" >Buscar</button>
        </form>
    </div>
    
    <div id="foroMazos" class="inferiorcontenido">
        <p style="color: white; padding: 20px;">Cargando los mejores mazos de Boedo...</p>
    </div>

    <footer class="pie_de_pagina">
        <div class="informacion_grupo"><a>NOSOTROS</a></div>
        <div>
            <ul class="lista_redes_sociales">
                <li><a href="#"><img src="../../img/img_instagram.png" class="redes_sociales"></a></li>
                <li><a href="#"><img src="../../img/img_facebook.png" class="redes_sociales"></a></li>
                <li><a href="#"><img src="../../img/twiter.png" class="redes_sociales"></a></li>
            </ul>
        </div>
    </footer>

    <div id="ventana_comentarios" class="contenedor_oculto selector_comentarios">
        <div class="salida_comentarios">
            <div><button class="barra">x</button></div>
            <div class="header_comentarios"><p>COMENTARIOS</p></div>
        </div>
        <div class="contenedor_comentarios" id="listaComentariosReal">
            <div class="comentarios">
                <p>Usa el buscador para encontrar mazos específicos.</p>
            </div>
            <div class="nuevo_comentario">
                <div class="imagen_usuario"><img src="../../img/LogoDefinitivo.jpg" /></div>
                <div class="comentar">
                    <div class="caja_comentario">
                        <input type="text" class="comentario" placeholder="Únete a la conversación">
                    </div>
                </div>
                <div class="boton_enviar_mensaje"><img src="../../img/boton_enviar_mensaje.png" /></div>
            </div>
        </div>
    </div>

     <script>
            let mazoActual = null;
        document.addEventListener('DOMContentLoaded', () => {
            const idLogueado = localStorage.getItem("usuarioId");
            const btnSesion = document.getElementById("btnSesion");
            const linksPrivados = document.querySelectorAll('.auth-required');

            if (idLogueado) {
                btnSesion.textContent = "Mi Perfil";
                btnSesion.href = "perfil.html";
                linksPrivados.forEach(l => l.style.display = "flex");
            } else {
                btnSesion.textContent = "Crear/Iniciar Sesión";
                btnSesion.href = "iniciarSesion.html";
                linksPrivados.forEach(l => l.style.display = "none");
            }

            cargarForo();
        });

        async function cargarForo() {
            const contenedor = document.getElementById("foroMazos");
            try {
                const res = await fetch('http://localhost:3000/mazos/publicos');
                if (!res.ok) throw new Error("Error en el servidor");
                const mazos = await res.json();

                if (mazos.length === 0) {
                    contenedor.innerHTML = "<p style='color:white; margin:20px;'>No hay mazos públicos todavía. ¡Sé el primero!</p>";
                    return;
                }

                contenedor.innerHTML = ""; // Limpiamos el texto de carga

                mazos.forEach(m => {
                  contenedor.innerHTML += `
                        <div class="mazo-publicado">
                              <div class="cabecera_mazo">
                                  <div class="costo_elixir">
                                        <img src="../../img/gota_elixir.png" alt="elixir"/>
                                        <span class="texto_superpuesto_elixir">${m.promedio_elixir || '0.0'}</span>
                                  </div>
                                  <p>${m.nombre}</p>
                              </div>
                              <div class="imagen_cartas">
                                  ${m.cartas && m.cartas.length > 0 
                                    ? m.cartas.map(c => `<div><img src="${c.imagen}" title="${c.nombre}" /></div>`).join('')
                                    : '<p style="color:gray; font-size:10px;">Mazo sin cartas</p>'}
                              </div>
                              <div class="pie_mazo">
                                  <div><p>Autor: <b>${m.autor_nombre}</b></p></div>
                                  <div><p>🏆 ${m.victorias_totales || 0}</p></div>
                              </div>
                              <button class="comentarios_mazos" onclick="abrirComentarios(${m.mazo_id})"> 
                                  comentarios
                              </button>
                        </div>
                  `;
                });

            } catch (err) {
                console.error("Error en foro:", err);
                contenedor.innerHTML = "<p style='color:white; padding:20px;'>El servidor de mazos está fuera de servicio. Revisa la consola (F12).</p>";
            }
        }

        const ventana = document.getElementById("ventana_comentarios");
        const barra_salida = document.querySelector(".salida_comentarios");

      async function abrirComentarios(mazoId) {
    mazoActual = mazoId; // 🔥 guardamos el mazo actual
    ventana.classList.remove("selector_comentarios");

    const lista = document.getElementById("listaComentariosReal");
    lista.innerHTML = "<p style='color:white'>Cargando comentarios...</p>";

    try {
        const res = await fetch(`http://localhost:3000/mazos/${mazoId}/comentarios`);

        if (!res.ok) {
            throw new Error("Error al obtener comentarios");
        }

        const comentarios = await res.json();

        if (comentarios.length === 0) {
            lista.innerHTML = "<p style='color:white'>No hay comentarios todavía</p>";
            return;
        }

        lista.innerHTML = comentarios.map(c => `
            <div class="comentarios">
                <b>${c.alias}</b>
                <p>${c.texto}</p>
                <small>${new Date(c.creado_en).toLocaleString()}</small>
            </div>
        `).join("");

    } catch (err) {
        console.error("Error cargando comentarios:", err);
        lista.innerHTML = "<p style='color:red'>Error al cargar comentarios</p>";
    }
}



        barra_salida.onclick = () => {
            ventana.classList.add("selector_comentarios");
        };
    </script>
</body>
</html>
