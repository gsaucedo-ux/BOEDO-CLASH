<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Usuario - Boedo Clash</title>
    <link rel="stylesheet" href="../STYLES/estiloPaginaCrearIniciar.css">
    <style>
        .contenedor-registro {
            width: 100%;
            max-width: 520px;
            margin: 120px auto;
            padding: 40px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 22px;
            box-shadow: 0 0 18px rgba(255, 215, 0, 0.35);
            color: white;
            text-align: center;
            font-size: 1.2em;
        }

        input {
            width: 92%;
            padding: 16px;
            margin-top: 20px;
            border-radius: 12px;
            border: none;
            outline: none;
            font-size: 1.1em;
        }

        .boton-crear {
            width: 92%;
            padding: 16px;
            margin-top: 30px;
            border-radius: 12px;
            background: #ffd700;
            border: none;
            font-weight: bold;
            font-size: 1.1em;
            cursor: pointer;
            transition: 0.3s;
        }

        .boton-crear:hover {
            transform: scale(1.05);
            box-shadow: 0 0 12px #ffd700;
        }

        a { color: #ffd700; text-decoration: none; }
    </style>
</head>
<body>

    <div class="contenedor-registro">
        <h2>Crear Usuario</h2>

        <input type="text" id="regNombre" placeholder="Nombre completo">
        <input type="text" id="regAlias" placeholder="Tu Alias (como te verán otros)">
        <input type="email" id="regCorreo" placeholder="Correo electrónico">
        <input type="password" id="regPass" placeholder="Contraseña">
        <input type="password" id="regPass2" placeholder="Repetir contraseña">

        <button class="boton-crear" onclick="registrar()">Crear cuenta</button>

        <p id="mensaje" style="margin-top:15px; font-size: 0.8em; color: #ffd700;"></p>

        <p style="margin-top:25px;">¿Ya tenés cuenta?
            <a href="iniciarSesion.html">Iniciar sesión</a>
        </p>
    </div>
    <a href="index.html" class="boton-volver-fijo">⮜ Volver</a>

    <script>
        async function registrar() {
            const nombre = document.getElementById('regNombre').value;
            const alias = document.getElementById('regAlias').value;
            const correo = document.getElementById('regCorreo').value;
            const pass = document.getElementById('regPass').value;
            const pass2 = document.getElementById('regPass2').value;
            const mensaje = document.getElementById('mensaje');

            if (!nombre || !alias || !correo || !pass) {
                mensaje.innerText = "⚠️ Por favor, completa todos los campos.";
                return;
            }

            if (pass !== pass2) {
                mensaje.innerText = "❌ Las contraseñas no coinciden.";
                return;
            }

            try {
                const response = await fetch('http://localhost:3000/usuario', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nombre,
                        alias,
                        correo,
                        contraseña: pass,
                        carta_favorita: "Ninguna" // Valor por defecto
                    })
                });

                if (response.ok) {
                    alert("¡Cuenta creada! Ya podés iniciar sesión.");
                    window.location.href = "iniciarSesion.html";
                } else {
                    const errorMsg = await response.text();
                    mensaje.innerText = "Error: " + errorMsg;
                }
            } catch (err) {
                mensaje.innerText = "🔌 Error de conexión con el servidor.";
            }
        }
    </script>
</body>
</html>
