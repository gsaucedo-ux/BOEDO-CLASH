<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Boedo Clash</title>
    <link rel="stylesheet" href="../STYLES/estiloPerfil.css">
</head>
<body>

<div class="perfil-contenedor">
    <div class="perfil-header">
        <img src="../../img/LogoDefinitivo.jpg" class="perfil-avatar">
        <div class="perfil-info">
            <h1 id="nombreUsuario">Cargando...</h1>
            <p>Nivel: <span id="nivelUsuario">--</span></p>
            <p>Trofeos: <span id="trofeosUsuario">--</span></p>
            <p>Carta Favorita: <span id="cartaFavoritaUsuario">--</span></p> </div>
    </div>

    <button class="boton-crear-mazo" onclick="crearMazo()">+ Crear Mazo</button>
    <h2 class="perfil-subtitulo">Tus Mazos</h2>
    <div id="contenedorMazos" class="publicaciones-grid"></div>
</div>

<a href="index.html" style="position: fixed; bottom: 20px; left: 20px; color: gold; text-decoration: none;">⮜ Volver al Inicio</a>

<script>
    // CAPTURAMOS EL ID REAL DEL LOGIN
    const usuarioId = localStorage.getItem("usuarioId");

    // SEGURIDAD: Si no hay ID, mandarlo a loguearse
    if (!usuarioId) {
        window.location.href = "iniciarSesion.html";
    }

    async function cargarDatosUsuario() {
        try {
            // Usamos la ruta que ya tenés en index.js
            const response = await fetch(`http://localhost:3000/usuario/${usuarioId}`);
            if (!response.ok) throw new Error("Error al obtener usuario");
            
            const data = await response.json();
            
            // Llenamos con los datos de tu tabla 'usuario'
            document.getElementById("nombreUsuario").textContent = data.alias;
            document.getElementById("nivelUsuario").textContent = data.nivel;
            document.getElementById("trofeosUsuario").textContent = data.trofeos;
            document.getElementById("cartaFavoritaUsuario").textContent = data.carta_favorita || "Ninguna";
            
        } catch (e) {
            console.error("Error cargando datos:", e);
            document.getElementById("nombreUsuario").textContent = "Error al cargar";
        }
    }

    async function renderMazos() {
        const cont = document.getElementById("contenedorMazos");
        try {
            // Traemos solo los mazos de ESTE usuario
            const response = await fetch(`http://localhost:3000/usuarios/${usuarioId}/mazos`);
            const mazos = await response.json();
            
            cont.innerHTML = "";

            if (!mazos || mazos.length === 0) {
                cont.innerHTML = `<p style="color:white; grid-column: 1/-1;">Aún no has creado mazos. ¡Anímate!</p>`;
                return;
            }

            mazos.forEach((m) => {
                cont.innerHTML += `
                    <div class="publicacion">
                        <h3>${m.nombre}</h3>
                        <div class="publicacion-cartas">
                            ${m.cartas && m.cartas.length > 0 
                                ? m.cartas.map(c => `<div class="carta-m"><img src="${c.imagen}" title="${c.nombre}"></div>`).join("")
                                : '<p>Sin cartas</p>'}
                        </div>
                        <div class="publicacion-botones">
                            <button onclick="togglePriv(${m.mazo_id}, ${m.es_publico})" class="boton-priv ${m.es_publico ? '' : 'privado'}">
                                ${m.es_publico ? "Público" : "Privado"}
                            </button>
                            <button onclick="verComentarios(${m.mazo_id})" class="boton-com">Comentarios</button>
                        </div>
                    </div>
                `;
            });
        } catch (e) {
            console.error("Error cargando mazos:", e);
            cont.innerHTML = "<p style='color:white;'>Error al cargar tus mazos.</p>";
        }
    }

    // Usamos la función que agregamos a usuarios.js
    async function togglePriv(idMazo, estadoActual) {
        try {
            const nuevoEstado = !estadoActual;
            const response = await fetch(`http://localhost:3000/mazos/${idMazo}/visibilidad`, {
                method: 'PUT', // Cambiamos a PUT que es más estándar para actualizar
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ es_publico: nuevoEstado })
            });
            
            if (response.ok) renderMazos(); 
        } catch(err) { 
            console.error("Error al cambiar visibilidad"); 
        }
    }

    function verComentarios(idMazo) { window.location.href = "comentarios.html?mazo=" + idMazo; }
    function crearMazo() { window.location.href = "crearMazo.html"; }

    // Ejecución
    cargarDatosUsuario();
    renderMazos();
</script>
</body>
</html>
