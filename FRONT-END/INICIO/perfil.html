<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Boedo Clash</title>
    <link rel="stylesheet" href="../STYLES/estiloPerfil.css">
    <style>
        /* Estilo rápido para el nuevo botón de cerrar sesión */
        .boton-logout {
            background-color: #d32f2f;
            color: white;
            border: 2px solid #fff;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        .boton-logout:hover {
            background-color: #b71c1c;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="perfil-contenedor">
    <div class="perfil-header">
        <img src="../../img/LogoDefinitivo.jpg" class="perfil-avatar">
        <div class="perfil-info">
            <h1 id="nombreUsuario">Cargando...</h1>
            <p>Nivel: <span id="nivelUsuario">--</span></p>
            <p>Trofeos: <span id="trofeosUsuario">--</span></p>
            <p>Carta Favorita: <span id="cartaFavoritaUsuario">--</span>
                <button onclick="mostrarSelectorCartas()" id="btnEditarCarta" style="margin-left:10px; cursor:pointer; background:none; border:1px solid gold; color:gold; border-radius:5px; padding:2px 5px; font-size:0.8em;">✎ Editar</button>
            </p>
            <div id="selectorContainer" style="display:none; margin-top:10px;">
                    <select id="selectCartas" style="padding:5px; border-radius:5px;"></select>
                    <button onclick="guardarCartaFavorita()" style="padding:5px 10px; background:green; color:white; border:none; border-radius:5px; cursor:pointer; margin-left:5px;">Guardar</button>
                    <button onclick="cancelarEdicion()" style="padding:5px 10px; background:gray; color:white; border:none; border-radius:5px; cursor:pointer; margin-left:5px;">Cancelar</button>
            </div>
            <button class="boton-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>
    </div>

    <button class="boton-crear-mazo" onclick="crearMazo()">+ Crear Mazo</button>
    <h2 class="perfil-subtitulo">Tus Mazos</h2>
    <div id="contenedorMazos" class="publicaciones-grid"></div>
</div>

<a href="index.html" style="position: fixed; bottom: 20px; left: 20px; color: gold; text-decoration: none;">⮜ Volver al Inicio</a>

<script>
    const usuarioId = localStorage.getItem("usuarioId");

    if (!usuarioId) {
        window.location.href = "iniciarSesion.html";
    }

    // FUNCIÓN PARA CERRAR SESIÓN
    function cerrarSesion() {
        localStorage.removeItem("usuarioId");
        window.location.href = "iniciarSesion.html";
    }

    async function cargarDatosUsuario() {
        try {
            const response = await fetch(`http://localhost:3000/usuario/${usuarioId}`);
            if (!response.ok) throw new Error("Error al obtener usuario");
            
            const data = await response.json();
            
            // Datos mapeados de tu tabla 'usuario'
            document.getElementById("nombreUsuario").textContent = data.alias;
            document.getElementById("nivelUsuario").textContent = data.nivel;
            document.getElementById("trofeosUsuario").textContent = data.trofeos;
            document.getElementById("cartaFavoritaUsuario").textContent = data.carta_favorita || "Ninguna";
            
        } catch (e) {
            console.error("Error cargando datos:", e);
            document.getElementById("nombreUsuario").textContent = "Error al cargar";
        }
    }

    async function renderMazos() {
        const cont = document.getElementById("contenedorMazos");
        try {
            const response = await fetch(`http://localhost:3000/usuarios/${usuarioId}/mazos`);
            const mazos = await response.json();
            
            cont.innerHTML = "";

            if (!mazos || mazos.length === 0) {
                cont.innerHTML = `<p style="color:white; grid-column: 1/-1;">Aún no has creado mazos. ¡Anímate!</p>`;
                return;
            }

            mazos.forEach((m) => {
                cont.innerHTML += `
                    <div class="publicacion">
                        <h3>${m.nombre}</h3>
                        <div class="publicacion-cartas">
                            ${m.cartas && m.cartas.length > 0 
                                ? m.cartas.map(c => `<div class="carta-m"><img src="${c.imagen}" title="${c.nombre}"></div>`).join("")
                                : '<p>Sin cartas</p>'}
                        </div>
                        <div class="publicacion-botones">
                            <button onclick="verComentarios(${m.mazo_id})" class="boton-com">Comentarios</button>
                        </div>
                    </div>
                `;
            });
        } catch (e) {
            console.error("Error cargando mazos:", e);
            cont.innerHTML = "<p style='color:white;'>Error al cargar tus mazos.</p>";
        }
    }

    function verComentarios(idMazo) { window.location.href = "comentarios.html?mazo=" + idMazo; }
    function crearMazo() { window.location.href = "crearMazo.html"; }

    cargarDatosUsuario();
    renderMazos();

    async function mostrarSelectorCartas() {
    const select = document.getElementById("selectCartas");
    const container = document.getElementById("selectorContainer");
    
    try {
        // Aprovechamos tu endpoint existente de /cartas
        const response = await fetch('http://localhost:3000/cartas');
        const cartas = await response.json();
        
        // Llenamos el select con los nombres
        select.innerHTML = cartas.map(c => `<option value="${c.nombre}">${c.nombre}</option>`).join("");
        
        container.style.display = "block";
        document.getElementById("btnEditarCarta").style.display = "none";
    } catch (e) {
        alert("Error al cargar las cartas");
    }
}

async function guardarCartaFavorita() {
    const nuevaCarta = document.getElementById("selectCartas").value;
    
    try {
        const response = await fetch(`http://localhost:3000/usuario/${usuarioId}/carta-favorita`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ carta_favorita: nuevaCarta })
        });

        if (response.ok) {
            // Reset de la página para ver los cambios como pediste
            window.location.reload();
        } else {
            alert("No se pudo actualizar");
        }
    } catch (e) {
        console.error(e);
        alert("Error de conexión");
    }
}

function cancelarEdicion() {
    document.getElementById("selectorContainer").style.display = "none";
    document.getElementById("btnEditarCarta").style.display = "inline";
}
</script>
</body>
</html>
