<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Boedo Clash</title>
    <link rel="stylesheet" href="../STYLES/estiloPerfil.css">
</head>
<body>

<div class="perfil-contenedor">
    <div class="perfil-header">
        <img src="../../img/LogoDefinitivo.jpg" class="perfil-avatar">
        <div class="perfil-info">
            <h1 id="nombreUsuario">Usuario</h1>
            <p>Nivel: <span id="nivelUsuario">14</span></p>
            <p>Trofeos: <span id="trofeosUsuario">5620</span></p>
        </div>
    </div>

    <button class="boton-crear-mazo" onclick="crearMazo()">+ Crear Mazo</button>
    <h2 class="perfil-subtitulo">Tus Mazos</h2>
    <div id="contenedorMazos" class="publicaciones-grid"></div>
</div>

<script>
    const usuarioId = 1; // El ID de Juancito en Docker

    // 1. CARGAR DATOS DEL USUARIO (Esta es la que te faltaba)
    async function cargarDatosUsuario() {
        try {
            const response = await fetch(`http://localhost:3000/usuarios/${usuarioId}`);
            if (!response.ok) throw new Error("Error al obtener usuario");
            
            const data = await response.json();
            
            // Actualizamos el HTML con los datos REALES de tu tabla 'usuario'
            document.getElementById("nombreUsuario").textContent = data.alias || data.nombre;
            document.getElementById("nivelUsuario").textContent = data.nivel;
            document.getElementById("trofeosUsuario").textContent = data.trofeos;
            
            // Guardamos en localStorage para persistencia rápida
            localStorage.setItem("usuario", data.alias || data.nombre);
        } catch (e) {
            console.error("Error cargando datos de usuario:", e);
            // Si falla, al menos ponemos el nombre que tengamos en localStorage
            document.getElementById("nombreUsuario").textContent = localStorage.getItem("usuario") || "Jugador";
        }
    }

    // 2. RENDERIZAR MAZOS (Tu función, mejorada para ser más robusta)
    async function renderMazos() {
        const cont = document.getElementById("contenedorMazos");
        try {
            const response = await fetch(`http://localhost:3000/usuarios/${usuarioId}/mazos`);
            const mazos = await response.json();
            
            cont.innerHTML = "";

            if (mazos.length === 0) {
                cont.innerHTML = `<p class="texto-vacio">Todavía no tienes mazos en la base de datos.</p>`;
                return;
            }

            mazos.forEach((m) => {
                cont.innerHTML += `
                    <div class="publicacion">
                        <h3>${m.nombre}</h3>
                        <div class="publicacion-cartas">
                            ${m.cartas.map(c => `
                                <div class="carta-m">
                                    <img src="${c.imagen}" alt="${c.nombre}" title="${c.nombre}">
                                </div>
                            `).join("")}
                        </div>
                        <div class="publicacion-botones">
                            <button onclick="togglePriv(${m.id}, ${m.es_publico})" class="boton-priv ${m.es_publico ? '' : 'privado'}">
                                ${m.es_publico ? "Público" : "Privado"}
                            </button>
                            <button onclick="verComentarios(${m.id})" class="boton-com">Comentarios</button>
                        </div>
                    </div>
                `;
            });
        } catch (e) {
            console.error("Error cargando mazos desde DB:", e);
            cont.innerHTML = "<p>Error al conectar con el servidor.</p>";
        }
    }

    // 3. CAMBIAR VISIBILIDAD
    async function togglePriv(idMazo, estadoActual) {
        try {
            const nuevoEstado = !estadoActual;
            const response = await fetch(`http://localhost:3000/mazos/${idMazo}/visibilidad`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ es_publico: nuevoEstado })
            });
            
            if (response.ok) renderMazos(); 
        } catch(err) { 
            console.error("Error al cambiar visibilidad"); 
        }
    }

    // NAVEGACIÓN
    function verComentarios(idMazo) { window.location.href = "comentarios.html?mazo=" + idMazo; }
    function crearMazo() { window.location.href = "crearMazo.html"; }

    // EJECUCIÓN AL CARGAR LA PÁGINA
    cargarDatosUsuario(); // <-- Ahora sí llamamos a la función del usuario
    renderMazos();        // <-- Y a la de los mazos
</script>
</body>
</html>
