<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Boedo Clash</title>
    <link rel="stylesheet" href="../STYLES/estiloPaginaCrearIniciar.css">
    <style>
        .contenedor-login {
            width: 100%;
            max-width: 520px;
            margin: 120px auto;
            padding: 40px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 22px;
            box-shadow: 0 0 18px rgba(255, 215, 0, 0.35);
            color: white;
            text-align: center;
            font-size: 1.2em;
        }

        input {
            width: 92%;
            padding: 16px;
            margin-top: 20px;
            border-radius: 12px;
            border: none;
            outline: none;
            font-size: 1.1em;
        }

        .boton-login {
            width: 92%;
            padding: 16px;
            margin-top: 30px;
            border-radius: 12px;
            background: #ffd700;
            border: none;
            font-weight: bold;
            font-size: 1.1em;
            cursor: pointer;
            transition: 0.3s;
        }

        .boton-login:hover {
            transform: scale(1.05);
            box-shadow: 0 0 12px #ffd700;
        }

        a {
            color: #ffd700;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="contenedor-login">
        <h2>Iniciar Sesión</h2>

        <input type="email" id="loginCorreo" placeholder="Correo electrónico">
        <input type="password" id="loginPass" placeholder="Contraseña">

        <button class="boton-login" onclick="hacerLogin()">Ingresar</button>

        <p id="mensaje" style="margin-top:15px; font-size: 0.8em; color: #ffd700;"></p>

        <p style="margin-top:25px;">¿No tenés cuenta?
            <a href="crearUsuario.html">Crear usuario</a>
        </p>
    </div>
    <a href="index.html" class="boton-volver-fijo">⮜ Volver</a>

    <script>
        async function hacerLogin() {
            const correo = document.getElementById('loginCorreo').value;
            const contraseña = document.getElementById('loginPass').value;
            const mensaje = document.getElementById('mensaje');

            if (!correo || !contraseña) {
                mensaje.innerText = "⚠️ Completa todos los campos.";
                return;
            }

            try {
                // Llamamos a la nueva ruta /login que creamos en index.js
                const response = await fetch('http://localhost:3000/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ correo, contraseña })
                });

                const data = await response.json();

                if (response.ok) {
                    // Guardamos la identidad en el navegador
                    localStorage.setItem("usuarioId", data.usuarioId);
                    localStorage.setItem("usuarioAlias", data.alias);
                    
                    alert("¡Bienvenido de nuevo, " + data.alias + "!");
                    window.location.href = "index.html"; // Volvemos al foro
                } else {
                    mensaje.innerText = "❌ " + (data.error || "Credenciales incorrectas");
                }
            } catch (err) {
                console.error(err);
                mensaje.innerText = "🔌 Error de conexión con el servidor.";
            }
        }
    </script>
</body>
</html>
