                </div>

                <div class="vs-text">VS</div>

                    </div>
                    
                    <button class="select-deck-button">
                        Escoger Mazo
                        <i class="arrow-down">▼</i>
                    </button>
                </div>

            </div>

            </div>

        <div id="card-selector-view" class="hidden-view contenedor-cartas">

                <button onclick="closeCardSelector()" class="select-deck-button" style="background-color: #555; margin-bottom: 20px;">

                </button>
                <p style="color: var(--cr-light); margin-bottom: 20px;">Selecciona una carta para el slot: <strong id="current-slot-id"></strong></p>
            </div>

            <h2>Cartas - Boedo Clash</h2>

            <div class="controls">
                <input id="buscador" class="buscador" placeholder="Buscar cartas (nombre en español)..." />

                <select id="filtro-rarity"><option value="todas">Rareza (todas)</option>
                    <option value="comun">Común</option><option value="especial">Especial</option>
                    <option value="epica">Épica</option><option value="legendaria">Legendaria</option>
                    <option value="campeon">Campeón</option>
                </select>

                <select id="filtro-elixir"><option value="todas">Elixir (todos)</option>
                    <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                    <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                    <option value="7">7</option><option value="8+">8+</option>
                </select>

                    <option value="tropa">Tropa</option><option value="hechizo">Hechizo</option><option value="estructura">Estructura</option>
                </select>

                <select id="filtro-attack"><option value="todos">Ataque (todos)</option>
                    <option value="terrestre">Terrestre</option><option value="aereo">Aéreo</option><option value="mixto">Ambos</option>
                </select>

                    <option value="support">Support</option><option value="swarm">Swarm</option>
                    <option value="defense">Defense</option><option value="spell">Spell</option>
                </select>
            </div>

            <div id="grid" class="grid-cartas"></div>
        </div>

    </div>

        // 2) LOGICA DE VISTAS Y SELECCION 
        
        function imageUrlFor(eng){
          return `https://cdn.royaleapi.com/static/img/cards/${eng}.png?t=${Date.now()}`; 
        }

        // Funcion para cambiar a la vista de selección
        function openCardSelector(slotId) {
            currentSlotId = slotId;
            currentSlotDisplay.textContent = slotId;
            
            battleView.classList.add('hidden-view');
            selectorView.classList.remove('hidden-view');
            
            applyFilters(); // Renderiza las cartas al abrir el selector
        }

        // Funcion para volver a la vista de batalla
        function closeCardSelector() {
            currentSlotId = null;
            selectorView.classList.add('hidden-view');
            battleView.classList.remove('hidden-view');
        }

        // Funcion que coloca la carta seleccionada en el slot de batalla
        function placeCardInSlot(cardData) {
            if (!currentSlotId) 
                return;

            const slotElement = document.getElementById(currentSlotId);
            const imageUrl = imageUrlFor(cardData.eng);
            slotElement.style.backgroundImage = `url('${imageUrl}')`;
            slotElement.classList.add('filled');
            slotElement.setAttribute('data-card-id', cardData.eng);

            closeCardSelector();
        }

        // 3) FUNCIONES DE RENDERIZADO, FILTRADO y INICIALIZACION

        function renderCards(list){
          cardGrid.innerHTML = "";
          list.forEach(c => {
            const div = document.createElement('div');
            div.className = 'carta';
            
            // Asigna el evento de clic para seleccionar y colocar la carta
            div.onclick = () => placeCardInSlot(c); 

            // Construccion del HTML de la carta 
            const img = document.createElement('img');
            img.src = imageUrlFor(c.eng);
            img.alt = c.esp;
            img.onerror = () => {
              const fb = document.createElement('div');
              fb.className = 'img-fallback';
              fb.textContent = c.esp.substring(0,12);
              img.replaceWith(fb);
            };

            const nameDiv = document.createElement('div');
            nameDiv.className = 'nombre-carta';
            nameDiv.textContent = c.esp;

            const meta = document.createElement('div');
            meta.className = 'meta';
            meta.innerHTML = `Elixir: ${c.elixir} • ${c.rarity.charAt(0).toUpperCase() + c.rarity.slice(1)} • ${c.type}`;

            div.appendChild(img);
            div.appendChild(nameDiv);
            div.appendChild(meta);
            cardGrid.appendChild(div);
          });
        }

        function applyFilters(){
            const text = buscador.value.trim().toLowerCase();
            const sel = {
                rarity: selects.rarity.value,
                elixir: selects.elixir.value,
                type: selects.type.value,
                attack: selects.attack.value,
                role: selects.role.value
            };

            const filtered = cardsData.filter(c => {
                const matchesText = !text || c.esp.toLowerCase().includes(text) || c.eng.toLowerCase().includes(text);
                const matchRarity = sel.rarity === 'todas' || c.rarity === sel.rarity;
                const matchType = sel.type === 'todas' || c.type === sel.type;
                const matchAttack = sel.attack === 'todos' || c.attack === sel.attack;
                const matchRole = sel.role === 'todos' || c.role === c.role;

                let matchElixir = true;
                if (sel.elixir !== 'todas') {
                    if (sel.elixir === '8+') matchElixir = parseInt(c.elixir) >= 8 || c.elixir === 'variable';
                    else matchElixir = c.elixir === sel.elixir;
                }

                return matchesText && matchRarity && matchType && matchAttack && matchRole && matchElixir;
            });

            renderCards(filtered);
        }

        window.onload = function() {
            // Inicializa los listeners de filtro
            buscador.addEventListener('input', applyFilters);
            Object.values(selects).forEach(s => s.addEventListener('change', applyFilters));
        }

    </script>
