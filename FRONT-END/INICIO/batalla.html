<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batalla - Boedo Clash</title>
    <link rel="stylesheet" href="../STYLES/estiloBatallas.css">
</head>
<body>

    <div class="main-wrapper">
        <div id="battle-view" class="battle-container">
            <h1>BATALLA ÉPICA DE MAZOS!!</h1>
            <div class="battle-grid-wrapper">
                
                <div class="opponent-deck opponent-1">
                    <h2>OPONENTE 1</h2>
                    <div class="deck-grid">
                        <div id="P1-S1" class="card-slot" onclick="openCardSelector('P1-S1')"></div>
                        <div id="P1-S2" class="card-slot" onclick="openCardSelector('P1-S2')"></div>
                        <div id="P1-S3" class="card-slot" onclick="openCardSelector('P1-S3')"></div>
                        <div id="P1-S4" class="card-slot" onclick="openCardSelector('P1-S4')"></div>
                        <div id="P1-S5" class="card-slot" onclick="openCardSelector('P1-S5')"></div>
                        <div id="P1-S6" class="card-slot" onclick="openCardSelector('P1-S6')"></div>
                        <div id="P1-S7" class="card-slot" onclick="openCardSelector('P1-S7')"></div>
                        <div id="P1-S8" class="card-slot" onclick="openCardSelector('P1-S8')"></div>
                    </div>
                </div>

                <div class="vs-text">VS</div>

                <div class="opponent-deck opponent-2">
                    <h2>OPONENTE 2</h2>
                    <div class="deck-grid">
                        <div id="P2-S1" class="card-slot" onclick="openCardSelector('P2-S1')"></div>
                        <div id="P2-S2" class="card-slot" onclick="openCardSelector('P2-S2')"></div>
                        <div id="P2-S3" class="card-slot" onclick="openCardSelector('P2-S3')"></div>
                        <div id="P2-S4" class="card-slot" onclick="openCardSelector('P2-S4')"></div>
                        <div id="P2-S5" class="card-slot" onclick="openCardSelector('P2-S5')"></div>
                        <div id="P2-S6" class="card-slot" onclick="openCardSelector('P2-S6')"></div>
                        <div id="P2-S7" class="card-slot" onclick="openCardSelector('P2-S7')"></div>
                        <div id="P2-S8" class="card-slot" onclick="openCardSelector('P2-S8')"></div>
                    </div>
                </div>
            </div>
            
            <div class="control-area">
                <button id="simulate-button" class="action-button">👑 SIMULAR BATALLA ⚔️</button>
                <div id="battle-result" class="result-box">Esperando Mazos...</div>
            </div>
        </div>

        <div id="card-selector-view" class="hidden-view contenedor-cartas">          
            <div class="header-selector">
                <button onclick="closeCardSelector()" class="select-deck-button">Volver a la Batalla</button>
                <p>Slot actual: <strong id="current-slot-id"></strong></p>
            </div>

            <div class="controls">
                <input id="buscador" class="buscador" placeholder="Buscar por nombre..." />
                <select id="filtro-rarity">
                    <option value="todas">Rarezas</option>
                    <option value="comun">Común</option>
                    <option value="especial">Especial</option>
                    <option value="epica">Épica</option>
                    <option value="legendaria">Legendaria</option>
                    <option value="campeon">Campeón</option>
                </select>
                <select id="filtro-type">
                    <option value="todas">Tipos</option>
                    <option value="tropa">Tropa</option>
                    <option value="hechizo">Hechizo</option>
                    <option value="estructura">Estructura</option>
                </select>
            </div>
            <div id="grid" class="grid-cartas"></div>
        </div>
    </div>

    <script>
        let currentSlotId = null;
        let cardsData = []; // Entidades de la base de datos

        // 1) CARGAR CARTAS DESDE EL BACKEND
        async function fetchCartas() {
            try {
                const res = await fetch('http://localhost:3000/cartas');
                cardsData = await res.json();
                renderCards(cardsData);
            } catch (err) {
                console.error("Error al cargar cartas:", err);
                document.getElementById('battle-result').textContent = "Error al conectar con la DB.";
            }
        }

        // 2) LÓGICA DE INTERFAZ
        function openCardSelector(slotId) {
            currentSlotId = slotId;
            document.getElementById('current-slot-id').textContent = slotId;
            document.getElementById('battle-view').classList.add('hidden-view');
            document.getElementById('card-selector-view').classList.remove('hidden-view');
        }

        function closeCardSelector() {
            document.getElementById('card-selector-view').classList.add('hidden-view');
            document.getElementById('battle-view').classList.remove('hidden-view');
        }

        function placeCardInSlot(card) {
            const slot = document.getElementById(currentSlotId);
            slot.style.backgroundImage = `url('${card.imagen}')`;
            slot.classList.add('filled');
            
            // Guardamos datos de la entidad en el slot para el combate
            slot.dataset.rol = card.rol_combate;
            slot.dataset.rarity = card.calidad;
            slot.dataset.elixir = card.costo_elixir;
            slot.dataset.name = card.nombre;

            closeCardSelector();
        }

        // 3) RENDERIZADO Y FILTROS
        function renderCards(list) {
            const grid = document.getElementById('grid');
            grid.innerHTML = "";
            list.forEach(c => {
                const div = document.createElement('div');
                div.className = 'carta';
                div.onclick = () => placeCardInSlot(c);
                div.innerHTML = `
                    <img src="${c.imagen}" alt="${c.nombre}">
                    <div class="nombre-carta">${c.nombre}</div>
                    <div class="meta">${c.costo_elixir}💧 • ${c.calidad}</div>
                `;
                grid.appendChild(div);
            });
        }

        function filter() {
            const text = document.getElementById('buscador').value.toLowerCase();
            const rarity = document.getElementById('filtro-rarity').value;
            const type = document.getElementById('filtro-type').value;

            const filtered = cardsData.filter(c => {
                const matchName = c.nombre.toLowerCase().includes(text);
                const matchRar = rarity === 'todas' || c.calidad.toLowerCase() === rarity;
                const matchTyp = type === 'todas' || c.tipo_carta.toLowerCase() === type;
                return matchName && matchRar && matchTyp;
            });
            renderCards(filtered);
        }

        // 4) SIMULACIÓN 
        document.getElementById('simulate-button').onclick = () => {
            let scoreP1 = 0;
            let scoreP2 = 0;

            for (let i = 1; i <= 8; i++) {
                const s1 = document.getElementById(`P1-S${i}`);
                const s2 = document.getElementById(`P2-S${i}`);

                if (s1.classList.contains('filled') && s2.classList.contains('filled')) {
                    if (s1.dataset.elixir > s2.dataset.elixir) scoreP1++;
                    else scoreP2++;
                }
            }
            document.getElementById('battle-result').textContent = `RESULTADO: ${scoreP1} - ${scoreP2}`;
        };

        window.onload = () => {
            fetchCartas();
            document.getElementById('buscador').oninput = filter;
            document.getElementById('filtro-rarity').onchange = filter;
            document.getElementById('filtro-type').onchange = filter;
        };
    </script>
</body>
</html>
